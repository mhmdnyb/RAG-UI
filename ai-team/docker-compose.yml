services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-university_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-university_db}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  rag-api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - hf_cache:/home/rag/.cache/huggingface
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-university_db}
      REDIS_URL: redis://redis:6379/0
      USE_QUEUE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker running asynchronous TaskIQ jobs (USE_QUEUE=true)
  rag-worker:
    build: .
    command: ["taskiq", "worker", "app.worker.broker:broker", "app.worker.tasks", "--workers", "1", "--max-async-tasks", "30"]
    volumes:
      - hf_cache:/home/rag/.cache/huggingface
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-university_db}
      REDIS_URL: redis://redis:6379/0
      USE_QUEUE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
