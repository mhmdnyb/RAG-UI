name: university-assistant

services:
  core-db:
    image: postgres:17
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rag}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hesam}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  core-server:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: core-server
    restart: unless-stopped
    depends_on:
      core-db:
        condition: service_healthy
      rag-api:
        condition: service_started
    environment:
      DB_HOST: core-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rag}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-hesam}
      RAG_SERVICE_HOST: rag-api
      RAG_SERVICE_PORT: 8000
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-university-rag-secret}
      RAG_CALLBACK_TOKEN: ${RAG_CALLBACK_TOKEN:-university-callback-secret}
      JWT_SECRET: ${JWT_SECRET:-universityassistantjwtsecretkeyformockingauthenticationshouldbeverylong}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    ports:
      - "8080:8080"
    networks:
      - app-network

  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-university_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${RAG_DB_PORT:-5433}:5432"
    volumes:
      - rag_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-university_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  rag-api:
    build:
      context: ./ai-team
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    depends_on:
      rag-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@rag-db:5432/${POSTGRES_DB:-university_db}
      REDIS_URL: redis://redis:6379/0
      USE_QUEUE: "true"
      CORE_SERVICE_URL: http://core-server:8080
      RAG_SERVICE_PORT: 8000
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-university-rag-secret}
      RAG_CALLBACK_TOKEN: ${RAG_CALLBACK_TOKEN:-university-callback-secret}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      DEFAULT_LLM_BASE_URL: ${DEFAULT_LLM_BASE_URL:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gapgpt-qwen-3.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GAPGPT_API_KEY: ${GAPGPT_API_KEY:-}
      GAPGPT_BASE_URL: ${GAPGPT_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ROUTER_API_KEY: ${ROUTER_API_KEY:-}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-}
      ROUTER_MODEL: ${ROUTER_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/home/rag/.cache/huggingface
    networks:
      - app-network

  rag-worker:
    build:
      context: ./ai-team
      dockerfile: Dockerfile
    container_name: rag-worker
    command: ["taskiq", "worker", "app.worker.broker:broker", "app.worker.tasks", "--workers", "1", "--max-async-tasks", "30"]
    restart: unless-stopped
    depends_on:
      rag-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-api:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@rag-db:5432/${POSTGRES_DB:-university_db}
      REDIS_URL: redis://redis:6379/0
      USE_QUEUE: "true"
      CORE_SERVICE_URL: http://core-server:8080
      RAG_SERVICE_PORT: 8000
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-university-rag-secret}
      RAG_CALLBACK_TOKEN: ${RAG_CALLBACK_TOKEN:-university-callback-secret}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      DEFAULT_LLM_BASE_URL: ${DEFAULT_LLM_BASE_URL:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gapgpt-qwen-3.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GAPGPT_API_KEY: ${GAPGPT_API_KEY:-}
      GAPGPT_BASE_URL: ${GAPGPT_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ROUTER_API_KEY: ${ROUTER_API_KEY:-}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-}
      ROUTER_MODEL: ${ROUTER_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
    volumes:
      - hf_cache:/home/rag/.cache/huggingface
    networks:
      - app-network

  frontend:
    build:
      context: ./RAG-project
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
    container_name: university-frontend
    restart: unless-stopped
    depends_on:
      - core-server
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network

  rag-seed:
    build:
      context: ./ai-team
      dockerfile: Dockerfile
    container_name: rag-seed
    command: ["sh", "-c", "python -m scripts.seed_classes && python -m scripts.ingest_regulations"]
    restart: "no"
    depends_on:
      rag-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@rag-db:5432/${POSTGRES_DB:-university_db}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - hf_cache:/home/rag/.cache/huggingface
    networks:
      - app-network
    profiles:
      - seed

volumes:
  core_db_data:
  rag_db_data:
  redis_data:
  hf_cache:

networks:
  app-network:
    driver: bridge
