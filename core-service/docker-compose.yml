services:
  postgres:
    image: postgres:17
    container_name: core-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-rag}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hesam}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  core-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rag}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-hesam}
      RAG_SERVICE_HOST: rag-service
      RAG_SERVICE_PORT: 8001
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN}
      RAG_CALLBACK_TOKEN: ${RAG_CALLBACK_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge