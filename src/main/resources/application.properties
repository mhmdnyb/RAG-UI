spring.application.name=core-server

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

rag.base-url=http://localhost:${RAG_SERVICE_PORT}
rag.service-token=${RAG_SERVICE_TOKEN}

rag.callback-token=${RAG_CALLBACK_TOKEN}

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
